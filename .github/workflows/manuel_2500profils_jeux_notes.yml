name: Manuel 2500 Profils Jeux Notes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install cheerio
        run: npm install cheerio

      - name: Run scraper
        run: node scripts/scrape_snokido_2500_games_rated.mjs

      - name: Commit results
        run: |
          git config user.name "snokiki-bot"
          git config user.email "snokiki-bot@users.noreply.github.com"

          git add data/players_games_rated.json

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Manual games rated update"
          git push
