<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Snoki de Base</title>

<link rel="stylesheet" href="style.css">
<script src="header.js" defer></script>
<script src="bars.js" defer></script>

<style>
body{
    margin:0;
    background: radial-gradient(1100px 600px at 25% 15%, #2a88ad 0%, #0b3551 60%, #062638 100%);
    font-family:Arial,sans-serif;
}
.wrap{max-width:1280px;margin:26px auto;padding:0 12px;}
.panel{
    background:#fff;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.28);
}
.titlebar{
    background:#3b3b3b;
    color:#fff;
    padding:14px 16px;
    font-size:22px;
    font-weight:900;
}
table{width:100%;border-collapse:collapse;}
th,td{
    padding:14px;
    border-bottom:1px solid #ddd;
}
th{
    text-align:left;
    background:#fafafa;
}
.rank{
    width:60px;
    text-align:center;
    font-weight:bold;
}
.center{text-align:center;}
.snoki{
    width:64px;
    height:64px;
    object-fit:contain;
}
.name a{
    color:#2c6fb7;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<main class="wrap">
<section class="panel">

<div class="titlebar">Snoki de Base</div>

<div class="barMount" data-bar="main"></div>

<table>
<thead>
<tr>
<th>#</th>
<th class="center">Snoki</th>
<th>Joueur</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

</section>
</main>

<script>

const snoki = {
"alex.c2109":"4.jpg",
"TheGladiator":"4.jpg",
"cahincaha":"4.jpg",
"acno":"4.jpg",

"Abelard":"13.jpg",
"Jordan.io":"13.jpg",
"Bételgeuse":"13.jpg",
"Golder":"13.jpg",
"blackout":"13.jpg",
"LargoJunior":"13.jpg",
"Pingu":"13.jpg",
"Polyy":"13.jpg",
"Fifi75018":"13.jpg",
"Zeta-Puppis":"13.jpg",

"francoeur":"36.jpg",
"Clovis1er":"36.jpg",
"Antarès_":"36.jpg",

"Ko0pa":"29.jpg",
"Houka":"29.jpg",
"Aldébaran":"29.jpg",
"venom2":"29.jpg",
"henoc77":"29.jpg",
"Brumaire":"29.jpg",

"Alexis279":"20.jpg",
"Napoléon.1er":"20.jpg",
"redbot":"20.jpg",
"PaulaHub":"20.jpg"
};

async function run(){

    const res=await fetch("period/players_pages.json");
    const data=await res.json();

    const joueurs=data.joueurs||data.players||data;

    joueurs.sort((a,b)=>(b.xp||0)-(a.xp||0));

    const tbody=document.getElementById("tbody");

    joueurs.slice(0,50).forEach((p,i)=>{

        const img=snoki[p.nom];

        tbody.innerHTML+=`
        <tr>
            <td class="rank">${i+1}</td>

            <td class="center">
                ${img?`<img class="snoki" src="snoki/${img}">`:""}
            </td>

            <td class="name">
                <a href="${p.profileHref||"#"}">${p.nom}</a>
            </td>
        </tr>`;
    });

}

run();

</script>

</body>
</html>
