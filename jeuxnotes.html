<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NV100 - Classement</title>

<link rel="stylesheet" href="style.css">
<script src="header.js" defer></script>
<script src="data.js" defer></script>
<script src="xp_widget.js" defer></script>

<style>
  body{
    margin:0;
    background: radial-gradient(1100px 600px at 25% 15%, #2a88ad 0%, #0b3551 60%, #062638 100%);
    font-family: Arial, sans-serif;
  }

  .box{
    width:1000px;
    max-width:calc(100% - 24px);
    margin:40px auto;
    background:#fff;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
  }

  .title{
    background:#3a3a3a;
    color:#fff;
    padding:14px 18px;
    font-size:20px;
    font-weight:700;
  }

  .tableWrap{
    width:100%;
    overflow-x:auto;
  }

  table{
    width:100%;
    min-width:700px;
    border-collapse:separate;
    border-spacing:0;
  }

  thead th{
    background:#fff;
    padding:12px 10px;
    text-align:left;
    font-size:13px;
    font-weight:700;
    border-bottom:1px solid #cfcfcf;
  }

  tbody td{
    padding:16px 10px;
    border-bottom:1px solid #cfcfcf;
    vertical-align:middle;
    font-size:14px;
  }

  tbody tr:nth-child(odd){
    background:#f2f2f2;
  }

  .rank{
    width:44px;
    text-align:center;
    color:#444;
    font-weight:700;
    font-size:16px;
  }

  .rank .badgeRank{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:28px;
    height:28px;
    padding:0 6px;
    border-radius:999px;
    background:#e9e9e9;
    border:1px solid #cfcfcf;
    font-size:13px;
    font-weight:900;
    line-height:1;
  }

  .avatar{
    width:90px;
    text-align:center;
  }

  .avatar .frame{
    width:64px;
    height:64px;
    margin:0 auto;
    background:#e9e9e9;
    border:1px solid #bdbdbd;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);
  }

  .avatar img{
    width:56px;
    height:56px;
    object-fit:cover;
    border:2px solid #8f8f8f;
    border-radius:6px;
    background:#ddd;
    display:block;
  }

  .name a{
    color:#2c6fb7;
    font-weight:700;
    text-decoration:none;
  }

  .name a:hover{
    text-decoration:underline;
  }

  .center{
    text-align:center;
    white-space:nowrap;
  }

  .hint{
    padding:10px 18px;
    font-size:13px;
    color:#555;
    border-top:1px solid #e5e5e5;
    background:#fafafa;
  }
</style>

<link rel="icon" href="avatar/favicon.ico">
</head>

<body>

<div class="box">

  <div class="title">
    Top 50 des joueurs ayant noté le plus de jeux
  </div>

  <div class="tableWrap">


<table id="leaderboard">

  <thead>
    <tr>
      <th></th>
      <th></th>
      <th>Nom du joueur</th>
      <th class="center">Jeux notés</th>
    </tr>
  </thead>

  <tbody></tbody>

</table>


  </div>

  <div class="hint">
    Classement des joueurs ayant noté le plus de jeux sur Snokido.
  </div>

</div>

<script>
window.addEventListener("DOMContentLoaded", async () => {

  const tbody = document.querySelector("#leaderboard tbody");

  try {

    // Chargement des joueurs ayant noté des jeux
    const responseRated = await fetch(
      "data/players_games_rated.json"
    );

    // Chargement de tous les profils et de leurs skins
    const responsePlayers = await fetch(
      "data/players_pages.json"
    );

    if (!responseRated.ok) {
      throw new Error(
        "Impossible de charger players_games_rated.json"
      );
    }

    if (!responsePlayers.ok) {
      throw new Error(
        "Impossible de charger players_pages.json"
      );
    }

    const ratedPlayers =
      await responseRated.json();

    const allPlayers =
      await responsePlayers.json();


    // Création d'une liste permettant de retrouver
    // rapidement chaque joueur grâce à son slug

    const playersBySlug = new Map();

    allPlayers.forEach(player => {

      const slug = slugify2(
        player.slug || player.nom
      );

      playersBySlug.set(
        slug,
        player
      );

    });


    // Fusion des données :
    // nombre de jeux notés + avatar du joueur

    const list = ratedPlayers.map(r => {

      const slug = slugify2(
        r.slug || r.nom
      );

      const joueur =
        playersBySlug.get(slug);


      return {

        nom:
          joueur?.nom ||
          r.nom,

        slug:
          joueur?.slug ||
          r.slug ||
          slug,

        jeuxNotes:
          Number(r.jeuxNotes) || 0,

        avatar:
          joueur?.avatar ||
          "avatar/1.jpg"

      };

    });


    // Tri du plus grand nombre de jeux notés
    // vers le plus petit

    list.sort(
      (a, b) =>
        b.jeuxNotes -
        a.jeuxNotes
    );


    // Suppression de l'ancien contenu

    tbody.innerHTML = "";


    // Affichage des 50 premiers joueurs

    list
      .slice(0, 50)
      .forEach((p, index) => {

        const tr =
          document.createElement("tr");


        tr.innerHTML = `

          <td class="rank">

            <span class="badgeRank">

              ${index + 1}

            </span>

          </td>


          <td class="avatar">

            <div class="frame">

              <img
                src="${p.avatar}"
                alt="Skin de ${p.nom}"
                onerror="
                  this.onerror = null;
                  this.src = 'avatar/1.jpg';
                "
              >

            </div>

          </td>


          <td class="name">

            <a
              href="profil.html?u=${encodeURIComponent(
                p.slug
              )}"
            >

              ${p.nom}

            </a>

          </td>


          <td class="center">

            ${p.jeuxNotes.toLocaleString(
              "fr-FR"
            )}

          </td>

        `;


        tbody.appendChild(tr);

      });


  } catch (err) {

    console.error(
      "Erreur du classement :",
      err
    );


    tbody.innerHTML = `

      <tr>

        <td
          colspan="4"
          style="padding:20px;"
        >

          Impossible de charger
          les données des joueurs.

        </td>

      </tr>

    `;

  }

});


function slugify2(name) {

  return String(name || "")

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .replace(
      /[^a-zA-Z0-9]/g,
      ""
    )

    .toLowerCase();

}
</script>


</body>
</html>
